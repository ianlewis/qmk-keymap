name: release

on:
  push:
    tags:
      - "v*.*.*" # Semver tags like v1.2.3

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    permissions:
      contents: read # Needed to check out the repo.
      security-events: write # Needed for zizmor to upload SARIF.
    uses: ./.github/workflows/pull_request.tests.yml

  # release
  ###############################
  build:
    name: Build firmware
    needs: [tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to write artifacts to a release.
    outputs:
      digests: ${{ steps.hash.outputs.digests }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make ergodox_ex-compile moonlander-compile

      # TODO(#91): Migrate to GitHub artifact attestations.
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail
          # Generate the subjects (base64 encoded).
          echo "digests=$(sha256sum ergodox_ez_base_ianlewis_dvorak.hex zsa_moonlander_ianlewis_dvorak.bin | base64 -w0)" >> "${GITHUB_OUTPUT}"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF#refs/tags/}" \
            --title "${GITHUB_REF#refs/tags/}" \
            --notes "Release ${GITHUB_REF#refs/tags/}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --verify-tag \
            ergodox_ez_base_ianlewis_dvorak.hex \
            zsa_moonlander_ianlewis_dvorak.bin

  # TODO(#91): Migrate to GitHub artifact attestations.
  provenance:
    name: Generate SLSA Provenance
    needs: [build]
    permissions:
      actions: read # To read the workflow path.
      id-token: write # To sign the provenance.
      contents: write # To add assets to a release.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true # Optional: Upload to a new release
